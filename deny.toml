# Supply-chain policy for cargo-deny: RustSec advisories, yanked crates,
# and dependency licenses, checked over the locked graph. Any advisory
# match is an error; accepting a risk requires an explicit
# advisories.ignore entry with an id and a reason.

[graph]
# Hermetic: check exactly the platforms the release matrix ships. Without
# this, cargo-deny checks all targets, adding wasm32/haiku/uefi-only crates.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
yanked = "deny"
# Scope, not a lint level: every crate in the graph flagged unmaintained
# fails the check.
unmaintained = "all"

[licenses]
# Deny-by-default. This minimal set covers every license expression in the
# locked graph (OR branches satisfy; only the Unicode-3.0 AND term in
# unicode-ident forces the third entry). Extend only when a new dependency
# actually requires another permissive license; copyleft (GPL/AGPL/LGPL/
# SSPL) is never added — stop and report instead.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"

[[bans.skip]]
name = "syn"
version = "=2.0.119"
reason = "windows-core on Windows targets requires syn v2 while clap_derive uses syn v3"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
