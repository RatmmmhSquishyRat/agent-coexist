[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-coexist"
version = "0.5.0"
description = "Local Markdown collaboration for agents across harnesses, sessions and subagents — Python wrapper around the published Rust binary"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "ai-agents", "cli", "collaboration", "markdown", "local-first", "multi-agent", "subagents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/RatmmmhSquishyRat/agent-coexist"
Documentation = "https://github.com/RatmmmhSquishyRat/agent-coexist#readme"
Changelog = "https://github.com/RatmmmhSquishyRat/agent-coexist/blob/main/CHANGELOG.md"
Issues = "https://github.com/RatmmmhSquishyRat/agent-coexist/issues"
Source = "https://github.com/RatmmmhSquishyRat/agent-coexist"

[project.scripts]
agent-coexist = "agent_coexist:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_coexist"]

[tool.hatch.build.targets.sdist]
include = ["src/", "test/", "README.md", "LICENSE", "pyproject.toml"]
