name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# The "ci-" prefix keeps the reusable form distinct: when release.yml calls
# this workflow, github.workflow is the caller's name, so the nested run
# joins "ci-release-<ref>" and can never cancel or block the caller's own
# "release-<ref>" group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-install:
    name: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (MSRV, per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09, toolchain pinned via input
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --release --locked

      - name: Install into an isolated prefix
        shell: bash
        run: cargo install --path . --locked --root "$RUNNER_TEMP/install"

      - name: "Smoke: installed binary end-to-end (real mechanism exercise)"
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/install/bin/agent-coexist"
          DEMO="$(mktemp -d)"
          cd "$DEMO"
          mkdir -p agents docs src/parser

          first_line() { printf '%s\n' "${1%%$'\n'*}"; }

          # Two frozen clocks so the notification window [since, now) is
          # non-empty by construction.
          NOW930="AGENT_COEXIST_NOW=2026-09-17T09:30:00Z"
          NOW="AGENT_COEXIST_NOW=2026-09-17T10:00:00Z"

          "$BIN" --version
          "$BIN" --help >/dev/null

          out="$(env $NOW "$BIN" profile agents/alice --section role -m 'Rust implementer.')"
          test "$(first_line "$out")" = "ok  profile  agents/alice"
          test -f agents/alice.agent-coexist.md

          out="$(env $NOW "$BIN" post docs/standup --as alice -m 'Daily standup thread. @bob please post your status here.')"
          test "$(first_line "$out")" = "ok  post  docs/standup"
          out="$(env $NOW930 "$BIN" post docs/standup --as bob -m '@#1 parser done, see src/parser/mod.rs. @alice review?')"
          test "$(first_line "$out")" = "ok  post  docs/standup"
          out="$(env $NOW "$BIN" subscribe docs/standup --as bob)"
          test "$(first_line "$out")" = "ok  subscribe  docs/standup"

          # brief path is relative to the brief file (docs/), not cwd
          printf 'pub fn parse(input: &str) -> Result<(), ()> {\n    Ok(())\n}\n' > src/parser/mod.rs
          out="$(env $NOW "$BIN" brief docs/onboarding --target ../src/parser/mod.rs --entry 'parser entry point' -m 'Start here.')"
          test "$(first_line "$out")" = "ok  brief  docs/onboarding"

          out="$(env $NOW "$BIN" state src/parser --as alice --status locked)"
          test "$(first_line "$out")" = "ok  state  src/parser"

          out="$(env $NOW "$BIN" check docs/standup)"
          test "$(first_line "$out")" = "ok  check  docs/standup"
          out="$(env $NOW "$BIN" read-brief docs/onboarding)"
          test "$(first_line "$out")" = "ok  read-brief  docs/onboarding"
          out="$(env $NOW "$BIN" check-state src)"
          test "$(first_line "$out")" = "ok  check-state  src"
          out="$(env $NOW "$BIN" lookfor-comment docs/standup --by bob)"
          test "$(first_line "$out")" = "ok  lookfor-comment  docs/standup"
          out="$(env $NOW "$BIN" list .)"
          test "$(first_line "$out")" = "ok  list  ."

          # #2 is both @#1 (alice's comment) and @alice → reply wins over mention
          out="$(env $NOW "$BIN" read-notification . --as alice --since 1h)"
          test "$(first_line "$out")" = "ok  read-notification  ."
          printf '%s\n' "$out" | grep -E '^  reply +2026-09-17T09:30:00Z +(\./)?docs/standup +#2 +bob '

          set +e
          out="$(env $NOW "$BIN" check does/not/exist 2>/dev/null)"
          rc=$?
          set -e
          test "$rc" -eq 1
          test "$(first_line "$out")" = "error  check  does/not/exist"

          set +e
          out="$(env $NOW "$BIN" post docs/standup --as 'bad nick!' -m x 2>/dev/null)"
          rc=$?
          set -e
          test "$rc" -eq 2
          test -z "$out"

          echo "smoke OK on ${{ matrix.os }}"

      - name: "Smoke: wait command observes a real change"
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/install/bin/agent-coexist"
          DEMO="$(mktemp -d)"
          cd "$DEMO"
          mkdir -p docs
          AGENT_COEXIST_NOW=2026-09-17T10:00:00Z "$BIN" post docs/standup --as alice -m 'seed' >/dev/null

          "$BIN" wait-post docs/standup --as bob >wait.out 2>wait.err &
          WPID=$!
          cleanup() { kill "$WPID" 2>/dev/null || true; wait "$WPID" 2>/dev/null || true; }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if grep -F 'waiting  wait-post  docs/standup' wait.err >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$WPID" 2>/dev/null; then
              echo "wait-post exited before the ready line"
              cat wait.err
              cat wait.out
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "wait-post never printed the ready line"
            cat wait.err
            exit 1
          fi

          AGENT_COEXIST_NOW=2026-09-17T10:00:05Z "$BIN" post docs/standup --as alice -m '@bob your turn' >/dev/null

          for _ in $(seq 1 30); do
            kill -0 "$WPID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$WPID" 2>/dev/null; then
            echo "wait-post did not finish after a qualifying change"
            cat wait.err
            exit 1
          fi
          set +e
          wait "$WPID"
          rc=$?
          set -e
          trap - EXIT
          test "$rc" -eq 0
          first="$(awk 'NR==1{print; exit}' wait.out)"
          test "$first" = "ok  wait-post  docs/standup"
          grep -F 'waiting  wait-post  docs/standup' wait.err
          echo "wait smoke OK on ${{ matrix.os }}"

  package:
    name: package (publish dry-run)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (MSRV, per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09, toolchain pinned via input
        with:
          toolchain: 1.89.0

      # Keep expanded package sources out of rust-cache's target cleanup.
      # A fresh namespace excludes older caches containing those sources.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: registry-only-v1
          cache-targets: "false"

      - name: Packaging dry-run against the locked graph
        # Verify in a scratch target dir so the expanded package never
        # enters the workspace target/ the cache walks.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/publish-verify
        run: cargo publish --dry-run --locked

  wrappers:
    name: wrappers (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      # The network group of each suite downloads the release for the version
      # the wrappers declare. On a commit that bumps the version, that release
      # does not exist yet, so CI runs the offline group only: target mapping,
      # SHA256SUMS parsing, archive extraction, and the version agreement with
      # Cargo.toml. The download path is exercised at release time.
      - name: npm wrapper
        env:
          AGENT_COEXIST_SKIP_NETWORK: "1"
        run: node packaging/npm/test/wrapper.test.js

      - name: PyPI wrapper
        env:
          AGENT_COEXIST_SKIP_NETWORK: "1"
        run: python packaging/pypi/test/test_wrapper.py

  supply-chain:
    name: supply-chain (cargo-deny)
    timeout-minutes: 10
    runs-on: ubuntu-24.04 # cargo-deny-action runs as docker, Linux only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Advisories and licenses (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # The action image's default Rust is too old for edition 2024.
          rust-version: 1.89.0
          # cargo-deny 0.20.x accepts --locked only before the subcommand;
          # the action places `arguments` there, `command-arguments` after.
          arguments: --all-features --locked
